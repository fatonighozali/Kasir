name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK Release
        run: |
          # Otomatis mencari lokasi folder yang memuat pubspec.yaml
          PROJECT_DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: File pubspec.yaml tidak ditemukan di repositori!"
            exit 1
          fi
          echo "Menemukan proyek di: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: smart-pos-release-apk
          path: '**/app-release.apk'
