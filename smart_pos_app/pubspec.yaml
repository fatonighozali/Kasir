name: smart_pos_app
description: "Aplikasi POS Kasir dengan Scan Barcode, Visual AI Produk, dan Firebase Firestore"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  mobile_scanner: ^5.2.3
  camera: ^0.11.0+2
  tflite_flutter: ^0.10.4
  image: ^4.3.0
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
